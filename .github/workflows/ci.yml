name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Recorded rather than pinned. The package declares no dependencies and
      # swift-tools-version 5.9, so it builds on anything from Swift 5.9 up, and
      # knowing which toolchain a given run used is what makes a failure here
      # readable later.
      - run: swift --version
      - run: swift build
      - run: swift test
      # PrivacyManifestTests asserts that Package.swift names the manifest in
      # its resources, which is a proxy: it reads the declaration rather than
      # the result. If the declaration were wrong, the build would still
      # succeed and the file would simply never reach an app. This reads what
      # the build produced.
      - name: Check the privacy manifest is in the built resource bundle
        run: |
          # Swift Package Manager names it <Package>_<Target>.bundle and puts it
          # beside the build products, but the path varies by toolchain and
          # architecture, so this looks for the bundle rather than assuming it.
          found=$(find .build -path '*.bundle/*' -name 'PrivacyInfo.xcprivacy')
          if [ -z "$found" ]; then
            echo "the build produced no resource bundle containing the manifest"
            echo "bundles present:"
            find .build -name '*.bundle' -maxdepth 4 || echo "  none"
            exit 1
          fi
          echo "$found"
          # Present is not correct. plutil parses it, and the two keys Apple
          # actually reads have to be there, so a truncated or renamed copy
          # fails here rather than at App Store review.
          for m in $found; do
            plutil -lint "$m"
            plutil -extract NSPrivacyAccessedAPITypes json -o - "$m" > /dev/null \
              || { echo "$m has no NSPrivacyAccessedAPITypes"; exit 1; }
            plutil -extract NSPrivacyCollectedDataTypes json -o - "$m" > /dev/null \
              || { echo "$m has no NSPrivacyCollectedDataTypes"; exit 1; }
          done
          echo "manifest shipped in a bundle, parses, and declares both keys"

  # Swift 6 language mode is where this package has to end up: it turns the
  # data-race checks that are warnings under the 5.x language mode into errors.
  # The sources are already written for it, with Sendable conformances,
  # @MainActor and explicit nonisolated(unsafe) on the two stored observers, so
  # the migration may well be clean, but nobody has ever run it.
  #
  # This job answers that question on every push without changing what ships:
  # the language mode is passed on the command line rather than set in
  # Package.swift, so consumers keep resolving the package exactly as they do
  # now. It is allowed to fail, so it reports rather than blocks. When it has
  # been green for a while, move the setting into Package.swift behind
  # swift-tools-version 6.0 and delete this job.
  swift6-language-mode:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Build under the Swift 6 language mode
        run: swift build -Xswiftc -swift-version -Xswiftc 6
      - name: Test under the Swift 6 language mode
        run: swift test -Xswiftc -swift-version -Xswiftc 6
